<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Find-it Challenge</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body>

    <div class="quiz-card">

        <div class="quiz-header">

            <span class="quiz-label">
                Find-it Challenge
            </span>

        </div>

        <div
            id="quiz-stage"
            class="quiz-stage">

            <h1
                id="question"
                class="question">
            </h1>

            <p
                id="answer-instruction"
                class="answer-instruction">
            </p>

            <div
                id="feedback"
                aria-live="polite"
                aria-atomic="true">
            </div>

        </div>

    </div>


    <script src="badges.js"></script>
    <script src="challenges.js"></script>
    <script src="find-data.js"></script>
<script src="progress.js?v=4"></script>
    <script src="find.js"></script>

</body>

</html>
