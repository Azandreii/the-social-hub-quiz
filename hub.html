<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Social Hub</title>

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="hub-page">

    <main class="hub-card">

    <!-- =====================================
         DASHBOARD TOP BAR
         ===================================== -->

    <header class="hub-dashboard-header">

        <div class="hub-dashboard-brand">

            <div class="hub-dashboard-logo">
                <span>THE</span>
                <span>SOCIAL</span>
                <span>HUB</span>
            </div>

            <div class="hub-dashboard-divider"></div>

            <div class="hub-dashboard-points">

                <span class="hub-dashboard-points-icon">
                    ☆
                </span>

                <div>
                    <strong id="hub-total-points">
                        0
                    </strong>

                    <span>
                        Hub Points
                    </span>
                </div>

            </div>

        </div>

        <button
            type="button"
            class="hub-dashboard-close"
            aria-label="Close My Social Hub"
            onclick="window.history.back()"
        >
            <span>Close</span>
            <span aria-hidden="true">×</span>
        </button>

    </header>


    <!-- =====================================
         DASHBOARD INTRO
         ===================================== -->

    <section class="hub-dashboard-intro">

        <h1 class="hub-title">
            My Social Hub
        </h1>

        <p>
            Your progress overview
        </p>

    </section>


    <!-- =====================================
         PROGRESS SUMMARY
         ===================================== -->

    <section class="hub-dashboard-stats">

        <article class="hub-dashboard-stat hub-dashboard-stat-points">

            <span class="hub-dashboard-stat-icon">
                ☆
            </span>

            <div>

                <strong
                    id="hub-dashboard-points-value"
                >
                    0
                </strong>

                <span>
                    Hub Points
                </span>

            </div>

            <button
                type="button"
                class="hub-dashboard-stat-link"
                id="hub-view-badges"
            >
                View all badges
                <span aria-hidden="true">→</span>
            </button>

        </article>


        <article class="hub-dashboard-stat">

            <span class="hub-dashboard-stat-icon">
                ✓
            </span>

            <div>

                <strong id="hub-completed-count">
                    0 / 0
                </strong>

                <span>
                    Challenges<br>
                    Completed
                </span>

            </div>

        </article>


        <article class="hub-dashboard-stat">

            <span class="hub-dashboard-stat-icon">
                ★
            </span>

            <div>

                <strong id="hub-perfected-count">
                    0 / 0
                </strong>

                <span>
                    Challenges<br>
                    Perfected
                </span>

            </div>

        </article>


        <article class="hub-dashboard-stat">

            <span class="hub-dashboard-stat-icon">
                ♧
            </span>

            <div>

                <strong id="hub-find-count">
                    0 / 0
                </strong>

                <span>
                    Find-it Challenges<br>
                    Completed
                </span>

            </div>

        </article>

    </section>


    <!-- Keep this for the existing JS temporarily -->

    <span
        id="hub-discovered-count"
        hidden
    >
        0 / 0
    </span>


    <!-- =====================================
         DASHBOARD CONTENT
         ===================================== -->

    <section class="hub-dashboard-content">


        <!-- CONTINUE JOURNEY -->

        <div class="hub-dashboard-column">

            <h2>
                Continue your journey
            </h2>

            <div
                id="hub-challenges"
                class="hub-challenges"
            >
            </div>

        </div>


        <!-- ACHIEVEMENTS -->

        <div class="hub-dashboard-column">

            <h2>
                Recent achievements
            </h2>

            <div
                id="hub-badges"
                class="hub-badges"
            >
            </div>

        </div>

    </section>

</main>


    <div class="dev-tools" id="dev-tools" hidden>

        <button type="button" class="dev-reset-button" id="dev-reset-button">
            Reset test progress
        </button>

    </div>

    <script src="theme.js?v=5"></script>
    <script src="challenges.js"></script>
    <script src="badges.js?v=2"></script>
    <script src="progress.js?v=4"></script>
    <script src="hub.js"></script>

</body>

</html>
