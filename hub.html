<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Social Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="hub-page">

    <main class="hub-card">

        <header class="hub-header">

            <div>

                <div class="hub-kicker">
                    The Social Hub Groningen
                </div>

                <h1 class="hub-title">
                    My Social Hub
                </h1>

            </div>

        </header>


        <section class="hub-points-panel">

            <div id="hub-total-points" class="hub-total-points">
                0
            </div>

            <div class="hub-total-label">
                Hub Points
            </div>

        </section>


        <section class="hub-section">

            <div class="hub-section-header">

                <div>

                    <div class="hub-section-kicker">
                        Your journey
                    </div>

                    <h2>
                        Tour progress
                    </h2>

                </div>

            </div>


            <div class="hub-progress-grid">

                <div class="hub-stat">

                    <strong id="hub-discovered-count">
                        0 / 0
                    </strong>

                    <span>
                        Discovered
                    </span>

                </div>


                <div class="hub-stat">

                    <strong id="hub-completed-count">
                        0 / 0
                    </strong>

                    <span>
                        Completed
                    </span>

                </div>


                <div class="hub-stat">

                    <strong id="hub-perfected-count">
                        0 / 0
                    </strong>

                    <span class="hub-stat-label">
                        <span class="hub-stat-symbol hub-stat-symbol-perfect">
                            ★
                        </span>
                        Perfected
                    </span>

                </div>

            </div>

        </section>


        <section class="hub-section">

            <div class="hub-section-header">

                <div>

                    <div class="hub-section-kicker">
                        Explore
                    </div>

                    <h2>
                        Challenges
                    </h2>

                </div>

            </div>


            <div id="hub-challenges" class="hub-challenges">
            </div>

        </section>


        <section class="hub-section">

            <div class="hub-section-header">

                <div>

                    <div class="hub-section-kicker">
                        Achievements
                    </div>

                    <h2>
                        Badges
                    </h2>

                </div>

            </div>


            <div id="hub-badges" class="hub-badges">
            </div>

        </section>

    </main>


    <div class="dev-tools" id="dev-tools" hidden>

        <button type="button" class="dev-reset-button" id="dev-reset-button">
            Reset test progress
        </button>

    </div>


    <script src="badges.js"></script>
    <script src="progress.js?v=4"></script>
    <script src="challenges.js"></script>
    <script src="hub.js"></script>

</body>

</html>
