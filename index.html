<!DOCTYPE html>
<html lang="en">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Social Hub Quiz</title>

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="dark">

    <div class="quiz-card">

        <div class="quiz-header">

            <span class="quiz-label">
                Quick Challenge
            </span>

            <span id="question-counter" class="question-counter"></span>

        </div>

        <div id="progress" class="progress"></div>

        <div id="quiz-stage" class="quiz-stage">

            <h1 id="question" class="question"></h1>

            <p id="answer-instruction" class="answer-instruction">
                Pick an answer
            </p>

            <div id="answers"></div>

            <div id="feedback" aria-live="polite" aria-atomic="true">
            </div>

        </div>

    </div>

    <script src="theme.js?v=5"></script>
    <script src="questions.js"></script>
    <script src="challenges.js"></script>
    <script src="badges.js?v=2"></script>
    <script src="progress.js?v=4"></script>
    <script src="script.js"></script>
    

</body>

</html>
