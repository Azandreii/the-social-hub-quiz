<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Social Hub Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="quiz-card">

    <div class="quiz-header">

        <span class="quiz-label">
            Quick Challenge
        </span>

        <span id="question-counter" class="question-counter"></span>

    </div>

    <div id="progress" class="progress"></div>

<div id="quiz-stage" class="quiz-stage">

    <h1 id="question" class="question"></h1>

    <p id="answer-instruction" class="answer-instruction">
        Pick an answer
    </p>

    <div id="answers"></div>

    <div
    id="feedback"
    aria-live="polite"
    aria-atomic="true">
</div>

</div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
    <script src="badges.js"></script>

</body>

</html>
