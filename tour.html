<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Social Hub Tour</title>


    <!-- KUULA PLAYER API -->

    <script src="https://static.kuula.io/api.js"></script>

    <link rel="stylesheet" href="theme.css">

    <style>
        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;

            overflow: hidden;

            background: #000000;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #111111;
        }



        /* =========================
           KUULA TOUR
           ========================= */


        #kuula-tour {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            border: 0;

            display: block;
        }



        /* =========================
   MAIN TOUR HEADER
   ========================= */


        .tour-hud {
            position: absolute;

            top: 14px;
            left: 14px;
            right: 14px;

            z-index: 30;

            min-height: 88px;

            display: grid;

            grid-template-columns:
                0.9fr 1.2fr 0.9fr;

            align-items: center;

            gap: 28px;

            padding: 12px 18px;

            border: 1.5px solid rgba(17, 17, 17, 0.28);

            border-radius: 16px;

            background:
                rgba(250, 249, 246, 0.97);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.16);

            pointer-events: none;

            transition:
                grid-template-columns 0.42s cubic-bezier(.22, .8, .25, 1),
                background-color 0.20s ease,
                border-color 0.20s ease,
                box-shadow 0.20s ease;
        }

        /* =========================
   HEADER WHILE KUULA CARD IS OPEN
   ========================= */

        .tour-hud.is-challenge-open {
            grid-template-columns:
                0.42fr 1.75fr 0.58fr;

            background: transparent;
            border-color: transparent;
            box-shadow: none;
        }


        .tour-hud.is-challenge-open .tour-hud-left,
        .tour-hud.is-challenge-open .tour-hud-actions {
            min-height: 72px;

            padding: 10px 16px;

            border: 1.5px solid rgba(17, 17, 17, 0.28);

            border-radius: 14px;

            background:
                rgba(250, 249, 246, 0.97);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.16);
        }




        /* =========================
   HEADER LEFT
   ========================= */


        .tour-hud-left {
            min-width: 0;

            display: flex;

            align-items: center;

            gap: 18px;

            pointer-events: auto;

            transition:
                background-color 0.28s ease,
                border-color 0.28s ease,
                box-shadow 0.28s ease,
                transform 0.42s cubic-bezier(.22, .8, .25, 1);
        }

        .tour-hud.is-challenge-open .tour-hud-left {
            transform: translateX(-6px);
        }

        .tour-brand {
            flex-shrink: 0;

            padding-right: 20px;

            border-right:
                1.5px solid rgba(17, 17, 17, 0.20);

            font-size: 14px;

            font-weight: 900;

            line-height: 0.88;

            letter-spacing: -0.5px;
        }


        .tour-points {
            min-width: 0;

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .tour-points-icon {
            flex-shrink: 0;

            color: #F2B705;

            font-size: 33px;

            line-height: 1;
        }


        .tour-points strong {
            display: block;

            font-size: 27px;

            font-weight: 800;

            line-height: 1;
        }


        .tour-points-label {
            display: block;

            margin-top: 4px;

            color: #5f5f5f;

            font-size: 12px;
        }



        /* =========================
   HEADER CENTER
   ========================= */


        .tour-current-challenge {
            min-width: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;

            opacity: 1;

            transform: translateY(0);

            transition:
                opacity 0.22s ease,
                transform 0.30s cubic-bezier(.22, .8, .25, 1),
                visibility 0.22s ease;
        }


        .tour-current-challenge.is-hidden {
            opacity: 0;

            transform: translateY(-10px) scale(0.98);

            visibility: hidden;

            pointer-events: none;
        }


        .tour-current-kicker {
            display: block;

            margin-bottom: 4px;

            color: #505050;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 0.11em;

            text-transform: uppercase;
        }


        .tour-current-title {
            margin: 0;

            overflow: hidden;

            color: #111111;

            font-size: 18px;

            font-weight: 800;

            line-height: 1.15;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .tour-current-progress {
            display: block;

            margin-top: 5px;

            color: #505050;

            font-size: 12px;
        }


        .tour-current-progress-track {
            width: min(290px, 100%);
            height: 4px;

            margin-top: 8px;

            overflow: hidden;

            border-radius: 999px;

            background: #e5e5e5;
        }


        .tour-current-progress-fill {
            width: 0%;
            height: 100%;

            border-radius: inherit;

            background: #F2B705;

            transition:
                width 0.2s ease;
        }



        /* =========================
   HEADER RIGHT
   ========================= */


        .tour-hud-actions {
            min-width: 0;

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 10px;
            pointer-events: auto;

            transition:
                background-color 0.28s ease,
                border-color 0.28s ease,
                box-shadow 0.28s ease,
                transform 0.42s cubic-bezier(.22, .8, .25, 1);
        }

        .tour-hud.is-challenge-open .tour-hud-actions {
            transform: translateX(6px);
        }


        .tour-hub-button,
        .tour-menu-button,
        .tour-fullscreen-button {
            height: 48px;

            border:
                1.5px solid rgba(17, 17, 17, 0.65);

            background: transparent;

            color: #111111;

            font: inherit;

            font-weight: 700;

            cursor: pointer;

            transition:
                background-color 0.15s ease,
                transform 0.15s ease,
                border-color 0.15s ease;
        }


        .tour-hub-button {
            min-width: 180px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 22px;

            padding: 0 18px;

            border-radius: 10px;

            white-space: nowrap;
        }


        .tour-menu-button,
        .tour-fullscreen-button {
            width: 50px;

            padding: 0;

            border-radius: 10px;

            font-size: 21px;
        }


        .tour-hub-button:hover,
        .tour-menu-button:hover,
        .tour-fullscreen-button:hover {
            background: rgba(242,
                    183,
                    5,
                    0.10);

            border-color: #111111;
        }


        .tour-hub-button:active,
        .tour-menu-button:active,
        .tour-fullscreen-button:active {
            transform: scale(0.97);
        }


        button:focus-visible {
            outline: 3px solid #f0c419;

            outline-offset: 2px;
        }



        /* =========================
           SHARED OVERLAY BACKDROP
           ========================= */


        .tour-overlay-backdrop {
            position: absolute;

            inset: 0;

            z-index: 40;

            background:
                rgba(17, 17, 17, 0.58);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.18s ease,
                visibility 0.18s ease;
        }


        .tour-overlay-backdrop.is-visible {
            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }



        /* =========================
           MY SOCIAL HUB OVERLAY
           ========================= */


        .tour-hub-overlay {
            position: absolute;

            top: 116px;
            left: 50%;

            z-index: 50;

            width: min(760px,
                    calc(100% - 32px));

            height: calc(100% - 132px);

            transform:
                translateX(-50%) translateY(12px);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            border: 2px solid #111111;

            border-radius: 16px;

            background: #faf9f6;

            overflow: hidden;

            transition:
                opacity 0.18s ease,
                transform 0.18s ease,
                visibility 0.18s ease;
        }


        .tour-hub-overlay.is-open {
            transform:
                translateX(-50%) translateY(0);

            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }


        .tour-overlay-header {
            position: absolute;

            top: 10px;
            right: 10px;

            z-index: 2;
        }


        .tour-panel-close {
            width: 44px;
            height: 44px;

            border: 2px solid #111111;

            border-radius: 50%;

            background: #faf9f6;

            color: #111111;

            font-size: 20px;

            cursor: pointer;
        }


        #tour-hub-frame {
            width: 100%;
            height: 100%;

            border: 0;

            display: block;

            background: #faf9f6;
        }



        /* =========================
           MENU PANEL
           ========================= */


        .tour-menu-panel {
            position: absolute;

            top: 116px;
            right: 14px;
            bottom: 14px;

            z-index: 60;

            width: min(390px, calc(100% - 28px));

            padding: 28px;

            border: 1.5px solid rgba(17, 17, 17, 0.35);

            border-radius: 16px;

            background: rgba(250, 249, 246, 0.98);

            box-shadow:
                0 18px 50px rgba(0, 0, 0, 0.22);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transform: translateX(28px);

            overflow-y: auto;

            transition:
                opacity 0.22s ease,
                transform 0.32s cubic-bezier(.22, .8, .25, 1),
                visibility 0.22s ease;
        }


        .tour-menu-panel.is-open {
            opacity: 1;

            visibility: visible;

            pointer-events: auto;

            transform:
                translateX(0);
        }


        .tour-menu-heading {
            display: flex;

            align-items: flex-start;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;
        }


        .tour-menu-kicker {
            display: block;

            margin-bottom: 7px;

            color: #505050;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 0.14em;

            text-transform: uppercase;
        }


        .tour-menu-heading h2 {
            margin: 0;

            font-size: 32px;

            font-weight: 800;

            line-height: 0.95;

            letter-spacing: -0.03em;
        }


        .tour-menu-close {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1.5px solid #111111;

            border-radius: 50%;

            background: transparent;

            color: #111111;

            font-size: 19px;
            line-height: 1;

            cursor: pointer;

            transition:
                background-color 0.15s ease,
                transform 0.15s ease;
        }

        .tour-menu-close:hover {
            background: rgba(242, 183, 5, 0.12);
        }

        .tour-menu-close:active {
            transform: scale(0.94);
        }


        .tour-menu-list {
            display: grid;

            gap: 10px;
        }


        .tour-menu-item {
            width: 100%;

            min-height: 58px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 14px;

            padding: 0 16px;

            border: 1.5px solid #111111;

            border-radius: 12px;

            background: #faf9f6;

            color: #111111;

            font: inherit;

            font-weight: 700;

            text-align: left;

            cursor: pointer;

            transition:
                background-color 0.15s ease,
                transform 0.15s ease,
                border-color 0.15s ease;
        }

        .tour-menu-item:hover {
            background: rgba(242, 183, 5, 0.10);
        }

        .tour-menu-item:active {
            transform: scale(0.985);
        }


        .tour-menu-item-symbol {
            margin-right: 8px;
        }

        #tour-menu-explore {
            background: #111111;
            color: #faf9f6;
            border-color: #111111;
        }

        #tour-menu-explore:hover {
            background: #2a2a2a;
        }

        #tour-menu-hub {
            background: rgba(242, 183, 5, 0.14);
        }

        #tour-menu-how:hover,
        #tour-menu-about:hover {
            background: rgba(17, 17, 17, 0.05);
        }

        #tour-menu-how,
        #tour-menu-about {
            min-height: 54px;

            border-color: rgba(17, 17, 17, 0.55);

            background: transparent;

            font-weight: 650;
        }

        #tour-menu-how.is-active,
        #tour-menu-about.is-active {
            background: rgba(242, 183, 5, 0.08);

            border-color: rgba(17, 17, 17, 0.85);
        }

        .tour-menu-divider {
            height: 2px;

            margin: 14px 0;

            background: #111111;
        }


        /* =========================
           DARK/LIGHT MODE STYLING CSS
           ========================= */

        .tour-menu-panel {
            background: var(--ui-surface);
            color: var(--ui-text);

            transition:
                opacity 0.22s ease,
                transform 0.32s cubic-bezier(.22, .8, .25, 1),
                visibility 0.22s ease,
                background-color 0.22s ease,
                color 0.22s ease;
        }

        .tour-menu-kicker,
        .tour-theme-kicker {
            color: var(--ui-muted);
        }

        .tour-theme-control {
            border-color: var(--ui-soft-border);
        }

        .tour-theme-button {
            border-color: var(--ui-border);
            color: var(--ui-text);
        }

        .tour-theme-button.is-active {
            border-color: var(--ui-text);
            background: var(--ui-text);
            color: var(--ui-surface);
        }

        body[data-theme="dark"] .tour-menu-close {
            border-color: var(--ui-text);
            color: var(--ui-text);
        }

        body[data-theme="dark"] #tour-menu-explore {
            background: #0f0f0f;

            border-color: rgba(245, 243, 238, 0.72);

            color: #f5f3ee;

            box-shadow:
                0 0 0 1px rgba(245, 243, 238, 0.08),
                0 8px 22px rgba(0, 0, 0, 0.28);
        }

        body[data-theme="dark"] #tour-menu-explore:hover {
            background: #171717;

            border-color: #f5f3ee;

            transform: translateY(-1px);
        }

        body[data-theme="dark"] #tour-menu-hub {
            background: rgba(242, 183, 5, 0.18);
            border-color: rgba(242, 183, 5, 0.65);
            color: #f5f3ee;
        }

        body[data-theme="dark"] #tour-menu-how,
        body[data-theme="dark"] #tour-menu-about {
            background: rgba(255, 255, 255, 0.035);
            border-color: rgba(245, 243, 238, 0.30);
            color: var(--ui-text);
        }

        body[data-theme="dark"] #tour-menu-how:hover,
        body[data-theme="dark"] #tour-menu-about:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        body[data-theme="dark"] #tour-menu-how.is-active,
        body[data-theme="dark"] #tour-menu-about.is-active {
            background: rgba(242, 183, 5, 0.12);
            border-color: rgba(242, 183, 5, 0.65);
        }

        body[data-theme="dark"] .tour-menu-divider {
            background: rgba(245, 243, 238, 0.70);
        }

        body[data-theme="dark"] .tour-menu-info {
            background: rgba(255, 255, 255, 0.045);
            border-color: rgba(245, 243, 238, 0.18);
        }

        body[data-theme="dark"] .tour-menu-info h3 {
            color: var(--ui-text);
        }

        body[data-theme="dark"] .tour-menu-info p {
            color: var(--ui-muted);
        }

        body[data-theme="dark"] .tour-hotspot-legend {
            border-color: rgba(245, 243, 238, 0.16);
        }

        body[data-theme="dark"] .tour-hotspot-legend-title,
        body[data-theme="dark"] .tour-hotspot-legend-item {
            color: var(--ui-text);
        }

        body[data-theme="dark"] .tour-theme-button {
            border-color: rgba(245, 243, 238, 0.30);
            color: var(--ui-text);
        }

        body[data-theme="dark"] .tour-theme-button:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        body[data-theme="dark"] .tour-theme-button.is-active {
            background: #f5f3ee;
            border-color: #f5f3ee;
            color: #111111;
        }

        body[data-theme="dark"] .tour-hud {
            background: rgba(29, 29, 29, 0.97);

            border-color: rgba(245, 243, 238, 0.28);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.32);

            color: var(--ui-text);
        }

        body[data-theme="dark"] .tour-brand {
            border-color: rgba(245, 243, 238, 0.20);

            color: var(--ui-text);
        }

        body[data-theme="dark"] .tour-points strong {
            color: var(--ui-text);
        }

        body[data-theme="dark"] .tour-points-label {
            color: var(--ui-muted);
        }

        body[data-theme="dark"] .tour-brand {
            border-color: rgba(245, 243, 238, 0.20);

            color: var(--ui-text);
        }

        body[data-theme="dark"] .tour-points strong {
            color: var(--ui-text);
        }

        body[data-theme="dark"] .tour-points-label {
            color: var(--ui-muted);
        }

        body[data-theme="dark"] .tour-hub-button,
        body[data-theme="dark"] .tour-menu-button,
        body[data-theme="dark"] .tour-fullscreen-button {
            border-color: rgba(245, 243, 238, 0.55);

            color: var(--ui-text);

            background: transparent;
        }

        body[data-theme="dark"] .tour-hub-button:hover,
        body[data-theme="dark"] .tour-menu-button:hover,
        body[data-theme="dark"] .tour-fullscreen-button:hover {
            background: rgba(242, 183, 5, 0.10);

            border-color: var(--ui-text);
        }

        body[data-theme="dark"] .tour-hud.is-challenge-open .tour-hud-left,

        body[data-theme="dark"] .tour-hud.is-challenge-open .tour-hud-actions {
            background: rgba(29, 29, 29, 0.97);

            border-color: rgba(245, 243, 238, 0.28);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.32);
        }




        /* =========================
           MENU INFORMATION PANEL
           ========================= */


        .tour-menu-info {
            margin-top: 0px;

            padding: 18px;

            border: 1.5px solid rgba(17, 17, 17, 0.20);

            border-radius: 12px;

            background: rgba(17, 17, 17, 0.035);
        }



        .tour-hotspot-legend {
            display: grid;

            gap: 7px;

            margin-top: 16px;

            padding-top: 14px;

            border-top: 1px solid rgba(17, 17, 17, 0.16);
        }


        .tour-hotspot-legend-title {
            margin-bottom: 2px;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 0.1em;

            text-transform: uppercase;
        }


        .tour-hotspot-legend-item {
            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 13px;

            font-weight: 700;
        }


        .tour-hotspot-legend-dot {
            width: 12px;
            height: 12px;

            flex-shrink: 0;

            border: 1.5px solid #111111;

            border-radius: 50%;
        }


        .tour-hotspot-legend-dot.is-discovered {
            background: #4D9DE0;
        }


        .tour-hotspot-legend-dot.is-completed {
            background: #63B76C;
        }


        .tour-hotspot-legend-dot.is-perfected {
            background: #F2B705;
        }

        .tour-hotspot-legend-star {
            width: 12px;

            flex-shrink: 0;

            color: #F2B705;

            font-size: 14px;

            line-height: 1;

            text-align: center;
        }


        .tour-hotspot-legend-dot.is-found {
            background: #9B6BD3;
        }


        .tour-menu-info[hidden] {
            display: none;
        }


        .tour-menu-info h3 {
            margin: 0 0 10px;

            font-size: 17px;

            font-weight: 800;

            line-height: 1.15;
        }

        .tour-menu-info p {
            margin: 0;

            color: #444444;

            font-size: 13px;

            line-height: 1.55;
        }

        .tour-theme-control {
            margin-top: 24px;

            padding-top: 20px;

            border-top:
                1px solid rgba(17, 17, 17, 0.16);
        }

        .tour-theme-copy {
            margin-bottom: 12px;
        }

        .tour-theme-kicker {
            display: block;

            margin-bottom: 4px;

            color: #5a5a5a;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 0.12em;

            text-transform: uppercase;
        }

        .tour-theme-copy strong {
            display: block;

            font-size: 16px;

            font-weight: 800;
        }

        .tour-theme-options {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;
        }

        .tour-theme-button {
            min-height: 46px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 0 12px;

            border:
                1.5px solid rgba(17, 17, 17, 0.45);

            border-radius: 10px;

            background: transparent;

            color: #111111;

            font: inherit;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background-color 0.15s ease,
                border-color 0.15s ease,
                transform 0.15s ease;
        }

        .tour-theme-button:hover {
            border-color: #111111;

            background:
                rgba(17, 17, 17, 0.04);
        }

        .tour-theme-button:active {
            transform: scale(0.98);
        }

        .tour-theme-button.is-active {
            border-color: #111111;

            background: #111111;

            color: #faf9f6;
        }



        /* =========================
           MOBILE
           ========================= */


        @media (max-width: 760px) {


            .tour-hub-overlay {
                top: 78px;

                height:
                    calc(100% - 88px);

                width:
                    calc(100% - 20px);

                border-radius: 14px;
            }



        }



        /* =========================
           REDUCED MOTION
           ========================= */


        @media (prefers-reduced-motion: reduce) {

            .tour-hub-button,
            .tour-menu-button,
            .tour-fullscreen-button,
            .tour-overlay-backdrop,
            .tour-hub-overlay,
            .tour-menu-panel {
                transition: none;
            }

            .tour-hud,
            .tour-hud-left,
            .tour-hud-actions,
            .tour-current-challenge {
                transition: none;
            }



        }

        /* =========================
   DARK HUD FINAL OVERRIDES
   ========================= */

        body[data-theme="dark"] .tour-hud.is-challenge-open {
            background: transparent;
            border-color: transparent;
            box-shadow: none;
        }


        body[data-theme="dark"] .tour-hud .tour-current-kicker {
            color: #b9b7b2;
        }


        body[data-theme="dark"] .tour-hud .tour-current-title {
            color: #f5f3ee;
        }


        body[data-theme="dark"] .tour-hud .tour-current-progress {
            color: #c8c6c1;
        }


        body[data-theme="dark"] .tour-hud .tour-current-progress-track {
            background: rgba(245, 243, 238, 0.20);
        }
    </style>

</head>



<body>


    <!-- =========================
     WRAPPER HUD
     ========================= -->


    <header class="tour-hud">

        <!-- LEFT: BRAND + HUB POINTS -->

        <div class="tour-hud-left">

            <div class="tour-brand" aria-label="The Social Hub">
                THE<br>
                SOCIAL<br>
                HUB
            </div>


            <div class="tour-points">

                <span class="tour-points-icon" aria-hidden="true">
                    ★
                </span>


                <div>

                    <strong id="tour-hub-points">
                        0
                    </strong>

                    <span class="tour-points-label">
                        Hub Points
                    </span>

                </div>

            </div>

        </div>



        <!-- CENTER: CURRENT CHALLENGE -->

        <div class="tour-current-challenge">

            <span class="tour-current-kicker">
                Current challenge
            </span>


            <h2 class="tour-current-title" id="tour-current-title">
                Explore The Social Hub
            </h2>


            <span class="tour-current-progress" id="tour-current-progress">
                Discover challenges throughout the tour
            </span>


            <div class="tour-current-progress-track" aria-hidden="true">

                <div class="tour-current-progress-fill" id="tour-current-progress-fill"></div>

            </div>

        </div>



        <!-- RIGHT: ACTIONS -->

        <div class="tour-hud-actions">

            <button class="tour-hub-button" id="tour-open-hub" type="button">
                My Social Hub

                <span aria-hidden="true">
                    →
                </span>
            </button>


            <button class="tour-menu-button" id="tour-open-menu" type="button" aria-label="Open tour menu"
                aria-expanded="false">
                ☰
            </button>


            <button class="tour-fullscreen-button" id="tour-fullscreen" type="button" aria-label="Enter fullscreen">
                ⛶
            </button>

        </div>

    </header>



    <!-- =========================
         KUULA
         ========================= -->


    <iframe id="kuula-tour" src="https://kuula.co/share/collection/7TnKZ?thumbs=0&fs=0" allowfullscreen allow="
            xr-spatial-tracking;
            gyroscope;
            accelerometer
        "></iframe>



    <!-- =========================
         DARK OVERLAY
         ========================= -->


    <div class="tour-overlay-backdrop" id="tour-overlay-backdrop" aria-hidden="true"></div>



    <!-- =========================
         MY SOCIAL HUB
         ========================= -->


    <section class="tour-hub-overlay" id="tour-hub-overlay" aria-label="My Social Hub">

        <div class="tour-overlay-header">

            <button class="tour-panel-close" id="tour-close-hub" type="button" aria-label="Close My Social Hub">
                ✕
            </button>

        </div>


        <iframe id="tour-hub-frame" title="My Social Hub" src="about:blank"></iframe>

    </section>



    <!-- =========================
         MENU
         ========================= -->


    <aside class="tour-menu-panel" id="tour-menu-panel" aria-label="Tour menu">

        <div class="tour-menu-heading">

            <div>

                <span class="tour-menu-kicker">
                    The Social Hub
                </span>

                <h2>
                    Explore
                </h2>

            </div>


            <button class="tour-menu-close" id="tour-close-menu" type="button" aria-label="Close menu">
                ✕
            </button>

        </div>



        <div class="tour-menu-list">

            <button class="tour-menu-item" id="tour-menu-explore" type="button">
                <span>
                    <span class="tour-menu-item-symbol" aria-hidden="true">
                        ↗
                    </span>

                    Explore the tour
                </span>

                <span aria-hidden="true">
                    →
                </span>
            </button>


            <button class="tour-menu-item" id="tour-menu-hub" type="button">
                <span>
                    <span class="tour-menu-item-symbol" aria-hidden="true">
                        ★
                    </span>

                    My Social Hub
                </span>

                <span aria-hidden="true">
                    →
                </span>
            </button>


            <div class="tour-menu-divider"></div>


            <button class="tour-menu-item" id="tour-menu-how" type="button">
                <span>
                    <span class="tour-menu-item-symbol" aria-hidden="true">
                        ?
                    </span>

                    How challenges work
                </span>

                <span aria-hidden="true">
                    +
                </span>
            </button>


            <button class="tour-menu-item" id="tour-menu-about" type="button">
                <span>
                    <span class="tour-menu-item-symbol" aria-hidden="true">
                        i
                    </span>

                    About this experience
                </span>

                <span aria-hidden="true">
                    +
                </span>
            </button>

        </div>



        <div class="tour-menu-info" id="tour-menu-info" hidden>

            <h3 id="tour-menu-info-title">
                Information
            </h3>

            <p id="tour-menu-info-text">
            </p>

        </div>

        <div class="tour-theme-control">

            <div class="tour-theme-copy">

                <span class="tour-theme-kicker">
                    Appearance
                </span>

                <strong>
                    Theme
                </strong>

            </div>

            <div class="tour-theme-options" role="group" aria-label="Theme">

                <button class="tour-theme-button is-active" id="tour-theme-light" type="button" aria-pressed="true">
                    ☀
                    <span>Light</span>
                </button>

                <button class="tour-theme-button" id="tour-theme-dark" type="button" aria-pressed="false">
                    ☾
                    <span>Dark</span>
                </button>

            </div>

        </div>

    </aside>



    <!-- =========================
         SHARED PROGRESSION
         ========================= -->


    <script src="challenges.js?v=2"></script>
    <script src="badges.js?v=2"></script>
    <script src="progress.js?v=4"></script>




    <!-- =========================
         TOUR CONTROLLER
         ========================= -->


    <script>

        let kuulaFrameId = null;



        /* =========================
           PROGRESS
           ========================= */


        loadTourProgress();


        function renderTourHud() {

            const summary =
                getTourProgressSummary();


            const pointsElement =
                document.getElementById(
                    "tour-hub-points"
                );


            pointsElement.textContent =
                summary.hubPoints;

            const pointsContainer =
                pointsElement.closest(
                    ".tour-points"
                );

            pointsContainer.classList.toggle(
                "is-compact",
                summary.hubPoints >= 1000
            );

        }


        renderTourHud();



        /* =========================
           KUULA PLAYER
           ========================= */

        // =========================
        // HOTSPOT PROGRESSION STATES
        // =========================


        const HOTSPOT_COLORS = {

            discovered:
                "#4D9DE0",   // blue

            completed:
                "#63B76C",   // green

            perfected:
                "#F2B705",   // gold

            found:
                "#9B6BD3"    // purple

        };


        function getChallengeHotspotState(
            challenge
        ) {

            const progress =
                tourProgress.challengeProgress[
                challenge.id
                ];


            /*
                No saved progress means the
                hotspot should keep its normal
                Kuula appearance.
            */

            if (!progress) {
                return "default";
            }


            /*
                PERFECTED
        
                Check this before completed,
                because a perfected challenge
                is also technically completed.
            */

            if (
                challenge.supportsPerfect === true &&
                progress.completed === true &&
                progress.bestScore >=
                challenge.perfectScore
            ) {

                return "perfected";

            }


            /*
                FIND-IT
        
                Binary spatial challenges do not
                have a Perfect state. Completion
                means the target was found.
            */

            if (
                (
                    challenge.type === "find-it" ||
                    challenge.type === "find"
                ) &&
                progress.completed === true
            ) {

                return "found";

            }


            /*
                COMPLETED
        
                Performance challenge completed,
                but not yet perfected.
            */

            if (
                progress.completed === true
            ) {

                return "completed";

            }


            /*
                DISCOVERED
        
                Challenge has been opened but
                not yet completed.
            */

            if (
                progress.discovered === true
            ) {

                return "discovered";

            }


            return "default";

        }



        function updateChallengeHotspot(
            challenge
        ) {

            if (
                !kuulaFrameId ||
                !challenge.kuulaHotspotId
            ) {
                return;
            }


            const state =
                getChallengeHotspotState(
                    challenge
                );


            /*
                Leave untouched hotspots using
                their normal Kuula appearance.
            */

            if (
                state === "default"
            ) {
                return;
            }


            const color =
                HOTSPOT_COLORS[
                state
                ];


            if (!color) {
                return;
            }


            KuulaPlayerAPI.setParam(
                kuulaFrameId,
                challenge.kuulaHotspotId,
                "tint",
                color
            );


            KuulaPlayerAPI.setParam(
                kuulaFrameId,
                challenge.kuulaHotspotId,
                "opacity",
                1
            );


            console.log(
                "HOTSPOT STATE:",
                challenge.id,
                state,
                color
            );

        }



        function updateAllChallengeHotspots() {

            if (!kuulaFrameId) {
                return;
            }


            challenges.forEach(
                function (challenge) {

                    updateChallengeHotspot(
                        challenge
                    );

                }
            );

        }


        KuulaPlayerAPI.addEventListener(
            "frameloaded",
            function (event) {

                kuulaFrameId =
                    event.frame;


                console.log(
                    "Kuula tour ready:",
                    kuulaFrameId
                );


                updateAllChallengeHotspots();

            }
        );

        KuulaPlayerAPI.addEventListener(
            "postloaded",
            function () {

                updateAllChallengeHotspots();

                showCurrentChallengeHud();

            }
        );

        KuulaPlayerAPI.addEventListener(
            "hotspot",
            function (event) {

                const hotspotName =
                    event.data &&
                    event.data.name;


                if (!hotspotName) {
                    return;
                }


                console.log(
                    "Hotspot:",
                    hotspotName
                );


                const challengeHotspot =
                    challenges.find(
                        function (challenge) {

                            return (
                                challenge.kuulaHotspotId ===
                                hotspotName
                            );

                        }
                    );


                const findTargetHotspot =
                    challenges.find(
                        function (challenge) {

                            return (
                                challenge.kuulaTargetHotspotId ===
                                hotspotName
                            );

                        }
                    );


                if (
                    challengeHotspot ||
                    findTargetHotspot
                ) {

                    hideCurrentChallengeHud();

                }

            }
        );

        /* !!! replace by another method
        KuulaPlayerAPI.addEventListener("cardclosed", function () {

            showCurrentChallengeHud();

        }); */



        /* =========================
           PROGRESS FROM CHALLENGES
           ========================= */

        /*
         * Restore the full HUD when a Kuula card closes.
         */
        window.addEventListener("message", (event) => {

            if (!event.origin.includes("kuula")) {
                return;
            }

            if (event.data?.cmd !== "cardclosed") {
                return;
            }

            showCurrentChallengeHud();

        });

        window.addEventListener(
            "message",
            function (event) {

                if (
                    event.origin !==
                    "https://azandreii.github.io"
                ) {
                    return;
                }


                if (
                    !event.data ||
                    event.data.type !==
                    "tsh-progress-update"
                ) {
                    return;
                }


                const receivedProgress =
                    event.data.progress;


                if (!receivedProgress) {
                    return;
                }


                tourProgress = {

                    hubPoints:
                        receivedProgress.hubPoints
                        || 0,

                    challengeProgress:
                        receivedProgress
                            .challengeProgress
                        || {},

                    unlockedBadges:
                        receivedProgress
                            .unlockedBadges
                        || []

                };


                saveTourProgress();

                renderTourHud();

                updateAllChallengeHotspots();


                console.log(
                    "WRAPPER PROGRESS UPDATED:",
                    getTourProgressSummary()
                );

            }
        );



        /* =========================
           OVERLAY ELEMENTS
           ========================= */


        const overlayBackdrop =
            document.getElementById(
                "tour-overlay-backdrop"
            );


        const hubOverlay =
            document.getElementById(
                "tour-hub-overlay"
            );


        const hubFrame =
            document.getElementById(
                "tour-hub-frame"
            );


        const menuPanel =
            document.getElementById(
                "tour-menu-panel"
            );


        const menuButton =
            document.getElementById(
                "tour-open-menu"
            );

        const menuInfo =
            document.getElementById(
                "tour-menu-info"
            );

        const currentChallengeHud =
            document.getElementById(
                "tour-current-title"
            ).closest(
                ".tour-current-challenge"
            );

        /* =========================
           LIGHT/DARK MODE
           ========================= */

        const lightThemeButton =
            document.getElementById(
                "tour-theme-light"
            );

        const darkThemeButton =
            document.getElementById(
                "tour-theme-dark"
            );

        const THEME_STORAGE_KEY =
            "tshTourTheme";



        /* =========================
           SHARED UI HELPERS
           ========================= */

        const tourHud =
            document.querySelector(
                ".tour-hud"
            );


        function hideCurrentChallengeHud() {

            if (
                !currentChallengeHud ||
                !tourHud
            ) {
                return;
            }


            currentChallengeHud.classList.add(
                "is-hidden"
            );


            tourHud.classList.add(
                "is-challenge-open"
            );

        }


        function showCurrentChallengeHud() {

            if (
                !currentChallengeHud ||
                !tourHud
            ) {
                return;
            }

            /*
             * First restore the full-width HUD.
             * The CSS grid transition now has time
             * to animate back from the two islands.
             */
            tourHud.classList.remove(
                "is-challenge-open"
            );

            /*
             * Then bring the centre information back
             * shortly after the header begins closing.
             */
            window.setTimeout(() => {

                currentChallengeHud.classList.remove(
                    "is-hidden"
                );

            }, 180);

        }


        function showBackdrop() {

            overlayBackdrop.classList.add(
                "is-visible"
            );

            overlayBackdrop.setAttribute(
                "aria-hidden",
                "false"
            );

        }


        function hideBackdropIfUnused() {

            const hubOpen =
                hubOverlay.classList.contains(
                    "is-open"
                );


            const menuOpen =
                menuPanel.classList.contains(
                    "is-open"
                );


            if (
                !hubOpen &&
                !menuOpen
            ) {

                overlayBackdrop.classList.remove(
                    "is-visible"
                );

                overlayBackdrop.setAttribute(
                    "aria-hidden",
                    "true"
                );

            }

        }



        /* =========================
           MY SOCIAL HUB
           ========================= */


        function openHub() {

            closeMenu();


            /*
                Reload the Hub each time so it
                reads the latest wrapper
                localStorage state.
            */

            hubFrame.src =
                "hub.html?embed=1";


            hubOverlay.classList.add(
                "is-open"
            );


            showBackdrop();

        }


        function closeHub() {

            hubOverlay.classList.remove(
                "is-open"
            );


            hideBackdropIfUnused();

        }


        document.getElementById(
            "tour-open-hub"
        ).addEventListener(
            "click",
            openHub
        );


        document.getElementById(
            "tour-close-hub"
        ).addEventListener(
            "click",
            closeHub
        );



        /* =========================
           MENU
           ========================= */

        const themeClients =
            new Set();


        window.addEventListener(
            "message",
            function (event) {

                if (
                    !event.data ||
                    event.data.type !==
                    "tsh-theme-request"
                ) {
                    return;
                }


                const allowedOrigin =
                    event.origin ===
                    "https://azandreii.github.io" ||

                    event.origin.startsWith(
                        "http://127.0.0.1:"
                    ) ||

                    event.origin.startsWith(
                        "http://localhost:"
                    );


                if (!allowedOrigin) {
                    return;
                }


                themeClients.add(
                    event.source
                );


                event.source.postMessage(
                    {
                        type:
                            "tsh-theme-update",

                        theme:
                            document.body.dataset.theme ===
                                "dark"
                                ? "dark"
                                : "light"
                    },
                    event.origin
                );


                /* console.log(
                    "THEME CLIENT CONNECTED:",
                    event.origin 
                ) */

            }
        );


        function applyTheme(theme) {


            /*    const themeClients =
                    new Set(); */

            const isDark =
                theme === "dark";


            document.body.dataset.theme =
                isDark
                    ? "dark"
                    : "light";

            lightThemeButton.classList.toggle(
                "is-active",
                !isDark
            );

            darkThemeButton.classList.toggle(
                "is-active",
                isDark
            );

            lightThemeButton.setAttribute(
                "aria-pressed",
                String(!isDark)
            );

            darkThemeButton.setAttribute(
                "aria-pressed",
                String(isDark)
            );

            localStorage.setItem(
                THEME_STORAGE_KEY,
                isDark
                    ? "dark"
                    : "light"
            );

            themeClients.forEach(
                function (clientWindow) {

                    try {

                        clientWindow.postMessage(
                            {
                                type:
                                    "tsh-theme-update",

                                theme:
                                    isDark
                                        ? "dark"
                                        : "light"
                            },
                            "*"
                        );

                    } catch (error) {

                        themeClients.delete(
                            clientWindow
                        );

                    }

                }
            );
        }

        lightThemeButton.addEventListener(
            "click",
            function () {

                applyTheme(
                    "light"
                );

            }
        );


        darkThemeButton.addEventListener(
            "click",
            function () {

                applyTheme(
                    "dark"
                );

            }
        );

        const savedTheme =
            localStorage.getItem(
                THEME_STORAGE_KEY
            );

        applyTheme(
            savedTheme === "dark"
                ? "dark"
                : "light"
        );

        function openMenu() {

            closeHub();


            menuPanel.classList.add(
                "is-open"
            );


            menuButton.setAttribute(
                "aria-expanded",
                "true"
            );


            showBackdrop();

        }


        function closeMenu() {

            menuPanel.classList.remove(
                "is-open"
            );


            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );


            menuInfo.hidden = true;

            updateMenuInfoToggle(
                null
            );


            hideBackdropIfUnused();

        }


        menuButton.addEventListener(
            "click",
            function () {

                const isOpen =
                    menuPanel.classList.contains(
                        "is-open"
                    );


                if (isOpen) {
                    closeMenu();
                } else {
                    openMenu();
                }

            }
        );


        document.getElementById(
            "tour-close-menu"
        ).addEventListener(
            "click",
            closeMenu
        );



        /* =========================
           MENU ACTIONS
           ========================= */


        document.getElementById(
            "tour-menu-explore"
        ).addEventListener(
            "click",
            function () {

                closeMenu();

            }
        );


        document.getElementById(
            "tour-menu-hub"
        ).addEventListener(
            "click",
            openHub
        );

        function updateMenuInfoToggle(activeButtonId) {

            const howButton =
                document.getElementById(
                    "tour-menu-how"
                );

            const aboutButton =
                document.getElementById(
                    "tour-menu-about"
                );

            const howSymbol =
                howButton.querySelector(
                    ':scope > span:last-child'
                );

            const aboutSymbol =
                aboutButton.querySelector(
                    ':scope > span:last-child'
                );

            howSymbol.textContent =
                activeButtonId === "tour-menu-how"
                    ? "−"
                    : "+";

            aboutSymbol.textContent =
                activeButtonId === "tour-menu-about"
                    ? "−"
                    : "+";

            howButton.classList.toggle(
                "is-active",
                activeButtonId === "tour-menu-how"
            );

            aboutButton.classList.toggle(
                "is-active",
                activeButtonId === "tour-menu-about"
            );
        }

        function showMenuInformation(
            title,
            text
        ) {

            document.getElementById(
                "tour-menu-info-title"
            ).textContent =
                title;


            document.getElementById(
                "tour-menu-info-text"
            ).textContent =
                text;


            menuInfo.hidden = false;

        }

        function showChallengeInformation() {

            document.getElementById(
                "tour-menu-info-title"
            ).textContent =
                "How challenges work";


            document.getElementById(
                "tour-menu-info-text"
            ).innerHTML = `

        Explore the virtual tour and interact
        with challenge hotspots. Completing
        challenges earns Hub Points and badges.

        <span class="tour-hotspot-legend">

            <span class="tour-hotspot-legend-title">
                Hotspot states
            </span>

            <span class="tour-hotspot-legend-item">

                <span
                    class="
                        tour-hotspot-legend-dot
                        is-discovered
                    "
                    aria-hidden="true">
                </span>

                Discovered

            </span>

            <span class="tour-hotspot-legend-item">

                <span
                    class="
                        tour-hotspot-legend-dot
                        is-completed
                    "
                    aria-hidden="true">
                </span>

                Completed

            </span>

<span class="tour-hotspot-legend-item">

    <span
        class="tour-hotspot-legend-star"
        aria-hidden="true">
        ★
    </span>

    Perfected

</span>

            <span class="tour-hotspot-legend-item">

                <span
                    class="
                        tour-hotspot-legend-dot
                        is-found
                    "
                    aria-hidden="true">
                </span>

                Found

            </span>

        </span>

    `;
            document.getElementById(
                "tour-menu-how"
            ).insertAdjacentElement(
                "afterend",
                menuInfo
            );

            updateMenuInfoToggle(
                "tour-menu-how"
            );

            menuInfo.hidden = false;



        }


        document.getElementById(
            "tour-menu-how"
        ).addEventListener(
            "click",
            function () {

                showChallengeInformation();

            }
        );


        document.getElementById(
            "tour-menu-about"
        ).addEventListener(
            "click",
            function () {
                document.getElementById(
                    "tour-menu-about"
                ).insertAdjacentElement(
                    "afterend",
                    menuInfo
                );

                updateMenuInfoToggle(
                    "tour-menu-about"
                );

                showMenuInformation(
                    "About this experience",
                    "This interactive prototype transforms The Social Hub Groningen virtual tour into a digital concierge experience, combining spatial exploration with lightweight challenges, progression and discovery."
                );

            }
        );



        /* =========================
           BACKDROP CLICK
           ========================= */


        overlayBackdrop.addEventListener(
            "click",
            function () {

                closeHub();
                closeMenu();

            }
        );



        /* =========================
           FULLSCREEN
           ========================= */


        const fullscreenButton =
            document.getElementById(
                "tour-fullscreen"
            );


        fullscreenButton.addEventListener(
            "click",
            async function () {

                try {

                    if (
                        !document.fullscreenElement
                    ) {

                        await document
                            .documentElement
                            .requestFullscreen();

                    } else {

                        await document
                            .exitFullscreen();

                    }

                } catch (error) {

                    console.error(
                        "Fullscreen failed:",
                        error
                    );

                }

            }
        );


        document.addEventListener(
            "fullscreenchange",
            function () {

                const isFullscreen =
                    Boolean(
                        document.fullscreenElement
                    );


                fullscreenButton.textContent =
                    isFullscreen
                        ? "✕"
                        : "⛶";


                fullscreenButton.setAttribute(
                    "aria-label",

                    isFullscreen
                        ? "Exit fullscreen"
                        : "Enter fullscreen"
                );

            }
        );



        /* =========================
           ESCAPE KEY
           ========================= */


        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key !== "Escape"
                ) {
                    return;
                }


                if (
                    hubOverlay.classList.contains(
                        "is-open"
                    )
                ) {

                    closeHub();

                    return;
                }


                if (
                    menuPanel.classList.contains(
                        "is-open"
                    )
                ) {

                    closeMenu();

                }

            }
        );

    </script>


</body>

</html>
